# TICK-стек для домашнего задания.
# Запуск: source .env-latest && docker compose up -d --build
# Суффикс :Z у томов — по рекомендации из задания (SELinux).

version: '3'

services:

  # InfluxDB — хранилище временных рядов
  influxdb:
    # https://hub.docker.com/r/library/influxdb/tags/
    build:
      context: ./images/influxdb/
      # TYPE из .env-latest
      dockerfile: ./${TYPE}/Dockerfile
      args:
        INFLUXDB_TAG: ${INFLUXDB_TAG}
    image: "influxdb"
    volumes:
      # Данные БД
      - ./influxdb/data:/var/lib/influxdb:Z
      # Конфигурация
      - ./influxdb/config/:/etc/influxdb/:Z
    ports:
      # HTTP API
      - "8086:8086"
      - "8082:8082"
      # UDP
      - "8089:8089/udp"

  # Telegraf — сбор метрик
  telegraf:
    # https://hub.docker.com/r/library/telegraf/tags/
    build:
      context: ./images/telegraf/
      dockerfile: ./${TYPE}/Dockerfile
      args:
        TELEGRAF_TAG: ${TELEGRAF_TAG}
    image: "telegraf"
    # Нужно для плагина inputs.docker
    privileged: true
    user: root
    # GID группы docker на хосте: getent group docker
    group_add:
      - "124"
    environment:
      # Имя узла в Chronograf
      HOSTNAME: "telegraf-getting-started"
    links:
      - influxdb
    volumes:
      # Конфиг Telegraf
      - ./telegraf/:/etc/telegraf/:Z
      # Сокет Docker; без :Z — стабильнее доступ к сокету
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # Порты из методички
      - "8092:8092/udp"
      - "8094:8094"
      - "8125:8125/udp"
    depends_on:
      - influxdb

  # Kapacitor — обработка метрик и оповещения
  kapacitor:
    # https://hub.docker.com/r/library/kapacitor/tags/
    build:
      context: ./images/kapacitor/
      dockerfile: ./${TYPE}/Dockerfile
      args:
        KAPACITOR_TAG: ${KAPACITOR_TAG}
    image: "kapacitor"
    volumes:
      - ./kapacitor/data/:/var/lib/kapacitor:Z
      - ./kapacitor/config/:/etc/kapacitor/:Z
    links:
      - influxdb
    ports:
      - "9092:9092"

  # Chronograf — веб-интерфейс
  chronograf:
    # https://hub.docker.com/r/library/chronograf/tags/
    build:
      context: ./images/chronograf
      dockerfile: ./${TYPE}/Dockerfile
      args:
        CHRONOGRAF_TAG: ${CHRONOGRAF_TAG}
    image: "chrono_config"
    environment:
      RESOURCES_PATH: "/usr/share/chronograf/resources"
    volumes:
      # Настройки Chronograf
      - ./chronograf/data/:/var/lib/chronograf/:Z
    links:
      - influxdb
      - kapacitor
    ports:
      # http://localhost:8888
      - "8888:8888"
    depends_on:
      - kapacitor
      - influxdb
      - telegraf
