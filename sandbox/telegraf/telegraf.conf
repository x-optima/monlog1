# Конфигурация Telegraf: сбор метрик и запись в InfluxDB

[agent]
  # Период сбора
  interval = "5s"
  # Привязка к границе интервала
  round_interval = true
  # Размер пакета при отправке
  metric_batch_size = 1000
  # Буфер при недоступности хранилища
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  # Период отправки в InfluxDB
  flush_interval = "5s"
  flush_jitter = "0s"
  precision = ""
  debug = false
  quiet = false
  logfile = ""
  # Имя узла из переменной окружения контейнера
  hostname = "$HOSTNAME"
  omit_hostname = false

# Запись в базу telegraf
[[outputs.influxdb]]
  # Имя сервиса в docker compose
  urls = ["http://influxdb:8086"]
  database = "telegraf"
  username = ""
  password = ""
  retention_policy = ""
  write_consistency = "any"
  timeout = "5s"

# Задание 9: метрики Docker
[[inputs.docker]]
  # Сокет Docker с хоста
  endpoint = "unix:///var/run/docker.sock"
  timeout = "5s"

# Задание 8: загрузка процессора (usage_system)
[[inputs.cpu]]

# Время работы, число процессов, средняя загрузка
[[inputs.system]]
